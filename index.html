<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">
      <i class="bi bi-speedometer2"></i> AdminPanel
    </a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Reports</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div class="container my-5">

  <!-- STATS -->
  <div class="row g-4 mb-4">

    <div class="col-md-4">
      <div class="card stats-card shadow-sm">
        <div class="card-body d-flex justify-content-between">
          <div>
            <h6>Total Users</h6>
            <h3>1,245</h3>
          </div>
          <i class="bi bi-people fs-1 text-primary"></i>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card stats-card shadow-sm">
        <div class="card-body d-flex justify-content-between">
          <div>
            <h6>Reports</h6>
            <h3>342</h3>
          </div>
          <i class="bi bi-file-earmark-text fs-1 text-success"></i>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card stats-card shadow-sm">
        <div class="card-body d-flex justify-content-between">
          <div>
            <h6>Pending</h6>
            <h3>18</h3>
          </div>
          <i class="bi bi-exclamation-circle fs-1 text-danger"></i>
        </div>
      </div>
    </div>

  </div>

  <!-- MAIN CARD -->
  <div class="card shadow">
    <div class="card-body">
      <h5 class="card-title">System Overview</h5>
      <p class="text-muted">
        Monitor activity and submit reports using the button below.
      </p>

      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#formModal">
        <i class="bi bi-plus-circle"></i> Submit Report
      </button>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Submit Report</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form class="needs-validation" novalidate>

          <!-- NAME -->
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" required>
            <div class="invalid-feedback">Name is required.</div>
          </div>

          <!-- EMAIL -->
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" required>
            <div class="invalid-feedback">Enter a valid email.</div>
          </div>

          <!-- MESSAGE -->
          <div class="mb-3">
            <label class="form-label">Report Details</label>
            <textarea class="form-control" rows="3" minlength="20" required></textarea>
            <div class="invalid-feedback">Minimum 20 characters required.</div>
          </div>

          <div class="modal-footer px-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">
              Submit Report
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Your JS -->
<script src="script.js"></script>

</body>
</html>
